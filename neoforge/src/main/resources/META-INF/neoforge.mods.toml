# NeoForge mod metadata (issue #187). Fabric's counterpart is fabric/src/main/resources/fabric.mod.json.
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/halisonworks/mod-halisoncode/issues"

[[mods]]
modId = "halisoncode"
version = "${version}"
displayName = "Halison Code"
authors = "Tor Einar Enne"
displayURL = "https://github.com/halisonworks/mod-halisoncode"
# Issue #198: the robot head of the editor's logo (target/docs/static/logo.svg); the same file is Fabric's icon.
logoFile = "assets/halisoncode/icon.png"
logoBlur = false
description = '''Program Kintro, a robot, with blocks, JavaScript or Python. Not approved by or associated with Mojang or Microsoft.'''
# 26.x: adds the enum game rule type (halisoncode:robot_camera); see NeoForgePlatform.enumRule. Empty on 1.21.1.
${enum_extensions}

# Common's mixin configs (both sides, and client only), the same files Fabric loads.
[[mixins]]
config = "halisoncode-common.mixins.json"

[[mixins]]
config = "halisoncode.mixins.json"

# Common's access transformer, also applied to the compile classpath by ModDevGradle (build.gradle.kts).
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"
${extra_access_transformers}

[[dependencies.halisoncode]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.halisoncode]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
